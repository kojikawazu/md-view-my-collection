name: Test

# コード変更用のワークフロー。ドキュメント変更（docs.yml）とは発火条件を分ける。
# front/ 配下でも .md はドキュメントなので除外し、テストを回さない。
#
# 注意: ワークフローレベルの paths を使っているため、このワークフローを
# ブランチ保護の required status check に指定してはならない。ドキュメントのみの PR で
# ワークフローが起動せず、必須チェックが pending のままマージ不能になる。
# 必須化する場合は paths を外し、変更判定ジョブ + job レベル if: に切り替える。
# 詳細は .claude/rules/github-actions.md を参照。
on:
  pull_request:
    paths:
      - "front/**"
      - "!front/**/*.md"
      - ".github/workflows/test.yml"
  push:
    branches:
      - main
    paths:
      - "front/**"
      - "!front/**/*.md"
      - ".github/workflows/test.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: front
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: front/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Type check (tsc)
        run: pnpm typecheck

  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: front
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: front/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

      - name: Run integration tests
        # Testcontainers が Docker で Postgres を起動する（ubuntu-latest は Docker 同梱）。
        run: pnpm test:integration

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        env:
          NEXT_PUBLIC_SUPABASE_URL: "http://localhost:54321"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "e2e-placeholder-anon-key"
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: front/playwright-report
