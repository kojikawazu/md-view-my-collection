# GitHub Actions ワークフロー自体の静的解析（actionlint）
# ルールの正本: .claude/rules/github-actions.md の「ワークフローの静的解析（actionlint）」
name: actionlint

# パスフィルタはかけない（数秒で終わるため、判定ジョブを足すほうが高くつく）。
# 必須チェックにしてもワークフロー自体は必ず起動するので、pending で詰まらない。
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      # actionlint は Git リポジトリの中で .github/workflows を探すため、checkout を先に置く
      - uses: actions/checkout@v4

      # スクリプト URL・actionlint 本体ともにバージョンを固定する。
      # latest にすると、コードを変えていないのに新リリースの検査強化で CI が落ちる。
      # Makefile の ACTIONLINT_VERSION と必ず同じ値にする。版差で結果が食い違うと
      # ローカル green / CI red が起きる（docs.yml の markdownlint と同じ理由）。
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: bash <(curl -sSfL "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash") "${ACTIONLINT_VERSION}"

      # shellcheck は GitHub ホストの ubuntu ランナーにプリインストール済みのため、
      # run: のシェルスクリプトも自動で併せて検査される（追加設定は不要）。
      - name: Run actionlint
        run: ./actionlint -color
