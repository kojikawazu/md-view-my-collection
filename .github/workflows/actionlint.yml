# GitHub Actions ワークフロー自体の静的解析（actionlint）
# ルールの正本: .claude/rules/github-actions.md の「ワークフローの静的解析（actionlint）」
name: actionlint

# パスフィルタはかけない（数秒で終わるため、判定ジョブを足すほうが高くつく）。
# 必須チェックにしてもワークフロー自体は必ず起動するので、pending で詰まらない。
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # actionlint は Git リポジトリの中で .github/workflows を探すため、checkout を先に置く
      - uses: actions/checkout@v4

      # 実行コマンドとイメージ（バージョン・ダイジェスト）の定義は Makefile の 1 箇所だけ。
      # ここに書き写すと、片方だけ更新されてローカル green / CI red が起きる（Issue #204）。
      # 公式イメージに shellcheck が同梱されるため、run: の中身も手元と同じ版で検査される。
      # Docker と make は GitHub ホストの ubuntu ランナーにプリインストール済み。
      - name: Run actionlint
        run: make actionlint
