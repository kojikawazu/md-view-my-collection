# Git の追跡対象に秘匿ファイル（鍵・.env 系）が含まれていないかを検査する（Issue #205）
# 判定ロジックの正本: .github/scripts/secret-scan.sh（ローカルでは make secret-scan で同じ検査を実行できる）
name: secret-scan

# パスフィルタはかけない。秘匿ファイルはどのパス・どの種類の変更でも混入しうるため、
# 絞ると混入経路を取りこぼす。git ls-files を読むだけで数秒で終わるので常時実行でよい。
# ワークフローが必ず起動するので、必須チェックにしても pending で詰まらない。
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # actionlint の shellcheck 連携は run: の中身しか見ないため、切り出したスクリプトは別に検査する。
      # shellcheck は GitHub ホストの ubuntu ランナーにプリインストール済み。
      - name: Shellcheck the scan scripts
        run: shellcheck .github/scripts/secret-scan.sh .github/scripts/secret-scan.test.sh

      # 検出パターンが壊れると「黙って見逃す」形で失敗するため、本番の検査の前にガード自体を検証する
      - name: Self-test the secret scan
        run: bash .github/scripts/secret-scan.test.sh

      - name: Assert no secret files are tracked
        run: bash .github/scripts/secret-scan.sh
